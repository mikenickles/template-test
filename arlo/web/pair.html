<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBFAF6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
  <title>Pair with Arlo</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <main class="thread">
      <section class="welcome">
        <h1>Pair this phone.</h1>
        <p>On your computer, open Arlo's menu, choose Phone, and show a pairing code. Then type it here.</p>
        <form id="pair">
          <input class="input code" id="code" placeholder="CODE" aria-label="Pairing code" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false">
          <button class="btn primary">Pair</button>
        </form>
        <p class="fine" id="message" role="status"></p>
      </section>
    </main>
  </div>
  <script type="module" src="/pair.js"></script>
</body>
</html>
