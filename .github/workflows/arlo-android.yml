name: Arlo Android app

# Builds the installable app so you never need Android Studio.
# Download it from the run's "Artifacts" section.
on:
  workflow_dispatch:
  push:
    paths:
      - "arlo/android/**"
      - ".github/workflows/arlo-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arlo/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: arlo-android
          path: arlo/android/app/build/outputs/apk/debug/app-debug.apk
