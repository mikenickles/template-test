name: AI Launcher APK

on:
  push:
    paths:
      - "ai-launcher/**"
      - ".github/workflows/ai-launcher.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The signing key lives only in repository secrets, never in the repo:
      #   ANDROID_KEYSTORE_BASE64   - the .keystore file, base64-encoded
      #   ANDROID_KEYSTORE_PASSWORD - its password (store and key share it)
      - name: Set up release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error title=Signing key missing::Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets (Settings > Secrets and variables > Actions). See ai-launcher/signing/README.md."
            exit 1
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/ailauncher-release.keystore"
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE" 2>/dev/null; then
            echo "::error title=Signing key invalid::ANDROID_KEYSTORE_BASE64 is not valid base64."
            exit 1
          fi
          if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias ailauncher > /dev/null 2>&1; then
            echo "::error title=Signing key invalid::Could not open the keystore with ANDROID_KEYSTORE_PASSWORD, or it has no 'ailauncher' key."
            exit 1
          fi
          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ailauncher
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ai-launcher.apk
      - name: Check the APK is signed with the release key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)/apksigner"
          want=$(keytool -exportcert -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias ailauncher | sha256sum | cut -d' ' -f1)
          got=$("$APKSIGNER" verify --print-certs ai-launcher.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [ "$want" != "$got" ]; then
            echo "::error title=Wrong signing key::ai-launcher.apk is signed with $got, expected the release key $want."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ai-launcher-apk
          path: ai-launcher/ai-launcher.apk
      # A fixed "launcher-latest" release always holds the newest APK, so it can be
      # downloaded straight from a phone's browser.
      - name: Publish to the launcher-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete launcher-latest --yes --cleanup-tag || true
          gh release create launcher-latest ai-launcher.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "AI Launcher (latest build)" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Download ai-launcher.apk on your phone and open it to install or update."
