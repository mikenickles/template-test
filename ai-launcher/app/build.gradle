plugins {
    id "com.android.application"
}

android {
    namespace "com.mikenickles.ailauncher"
    compileSdk 35

    defaultConfig {
        applicationId "com.mikenickles.ailauncher"
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    // One shared, intentionally public key so every build installs over the last one.
    // See ../signing/README.md before publishing anywhere.
    signingConfigs {
        sideload {
            storeFile file("../signing/ailauncher.keystore")
            storePassword "android"
            keyAlias "ailauncher"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.sideload
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
